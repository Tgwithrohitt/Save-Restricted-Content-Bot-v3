<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Post Vault · Online</title>
  <style>
    :root { color-scheme: dark; --ink:#eef5ff; --muted:#9db0ce; --line:rgba(168,192,255,.18); --aqua:#72e8d4; --violet:#9677ff; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; overflow:hidden; color:var(--ink); font:16px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#07101f; }
    body::before,body::after { content:""; position:fixed; width:42rem; height:42rem; border-radius:50%; filter:blur(80px); opacity:.25; pointer-events:none; }
    body::before { background:var(--violet); top:-22rem; left:-14rem; }
    body::after { background:var(--aqua); right:-20rem; bottom:-24rem; }
    main { width:min(92vw,540px); position:relative; padding:clamp(2rem,7vw,4rem); text-align:center; border:1px solid var(--line); border-radius:28px; background:linear-gradient(145deg,rgba(21,37,68,.88),rgba(8,17,33,.8)); box-shadow:0 25px 70px rgba(0,0,0,.35); backdrop-filter:blur(16px); }
    .mark { display:grid; place-items:center; width:60px; height:60px; margin:0 auto 1.4rem; border-radius:18px; font-size:29px; background:linear-gradient(135deg,var(--violet),var(--aqua)); box-shadow:0 10px 25px rgba(114,232,212,.2); }
    .eyebrow { margin:0 0 .7rem; color:var(--aqua); font-size:.73rem; font-weight:800; letter-spacing:.16em; }
    h1 { margin:0; font-size:clamp(2rem,7vw,3.4rem); letter-spacing:-.06em; }
    p { max-width:34ch; margin:1rem auto 0; color:var(--muted); }
    .status { display:inline-flex; gap:.55rem; align-items:center; margin-top:1.65rem; padding:.55rem .85rem; border:1px solid var(--line); border-radius:999px; color:#d8fff9; font-size:.86rem; background:rgba(5,17,31,.52); }
    .dot { width:.55rem; height:.55rem; border-radius:50%; background:var(--aqua); box-shadow:0 0 14px var(--aqua); }
    .features { display:grid; grid-template-columns:repeat(3,1fr); gap:.65rem; margin-top:2rem; color:#d7e3f8; font-size:.78rem; }
    .features span { padding:.8rem .45rem; border:1px solid var(--line); border-radius:13px; background:rgba(5,16,31,.27); }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">🪞</div>
    <p class="eyebrow">TELEGRAM POST VAULT</p>
    <h1>Online &amp; ready</h1>
    <p>Open the bot in Telegram to save a post or start a clean live channel clone.</p>
    <div class="status"><span class="dot"></span> Dashboard service is live</div>
    <div class="features"><span>📥 Save post</span><span>⚙️ Settings</span><span>👤 Account</span></div>
  </main>
</body>
</html>
